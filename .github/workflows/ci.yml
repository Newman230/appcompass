name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: appcompass
          POSTGRES_PASSWORD: appcompass
          POSTGRES_DB: appcompass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appcompass -d appcompass_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      APPCOMPASS_TEST_DATABASE_URL: postgresql://appcompass:appcompass@localhost:5432/appcompass_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t appcompass-server .
