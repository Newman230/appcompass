[project]
name = "appcompass-server"
version = "0.1.0"
description = "AppCompass backend: in-app AI support agent (your app guide)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "jsonschema>=4.22",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
